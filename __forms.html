<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CredaERP Form Registration</title>
</head>
<body>
  <!-- Static Netlify Form Registration Skeleton for Build Bots -->
  <form name="demo-request" method="POST" action="/" data-netlify="true" netlify data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="demo-request">
    <input type="text" name="bot-field">
    <input type="text" name="business-name">
    <input type="email" name="email">
    <input type="tel" name="whatsapp-number">
    <input type="text" name="gstin">
    <input type="text" name="selected-plan">
    <input type="text" name="selected-product">
  </form>
</body>
</html>
